name: Update Blog Posts
  

on:
  push:
      branches:
        - main # 또는 워크플로우를 트리거하고 싶은 브랜치 이름
  schedule:
    # 테스트를 원한다면, `한국 표준시 = UTC + 9` 참고해서 시간 수정한 후 테스트해보기
    - cron: '0 0 * * *'  # 매일 UTC 00:00 = 한국 시간 오전 9시
    - cron: '0 15 * * *' # 매일 UTC 15:00 = 한국 시간 자정(00:00)

jobs:
  update_blog:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v2

    - name: Set up Git identity
      run: |
        git config --global user.name 'jay1woo'
        git config --global user.email '50170372+WontelliJ@users.noreply.github.com'
        git remote set-url origin https://${{ secrets.GH_PAT }}@github.com/WontelliJ/jw-velog.git

    - name: Set up Python
      uses: actions/setup-python@v2
      with:
        python-version: '3.x'

    - name: Install dependencies
      run: |
        pip install feedparser gitpython

    - name: Run script
      run: python scripts/update_blog.py
